name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - run: for t in tests/*.mjs; do node "$t"; done

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        # The account ID is optional when the token can read memberships.
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy
      - name: Deploy landing pages worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy --config shop/wrangler.toml
      - name: Copy app secrets from GitHub to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        # Only secrets that are set in GitHub are copied; others are left as they are in Cloudflare.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE_OWNER_ID: ${{ secrets.VOICE_OWNER_ID }}
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          node -e '
            const out = {};
            for (const k of ["GEMINI_API_KEY", "VOICE_OWNER_ID"]) {
              let v = (process.env[k] || "").trim();
              if (k === "VOICE_OWNER_ID") v = v.toLowerCase();
              if (v) out[k] = v;
            }
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(out), { mode: 0o600 });
            console.log("Secrets to copy:", Object.keys(out).join(", ") || "none");
          '
          if [ "$(cat "$RUNNER_TEMP/secrets.json")" != "{}" ]; then
            npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          fi
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Copy shop secrets from GitHub to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        # New orders go to n8n when N8N_WEBHOOK_URL is set (see N8N-SETUP.md).
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          node -e '
            const out = {};
            for (const k of ["N8N_WEBHOOK_URL", "N8N_WEBHOOK_SECRET"]) { const v = (process.env[k] || "").trim(); if (v) out[k] = v; }
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/shop-secrets.json", JSON.stringify(out), { mode: 0o600 });
            console.log("Shop secrets to copy:", Object.keys(out).join(", ") || "none");
          '
          if [ "$(cat "$RUNNER_TEMP/shop-secrets.json")" != "{}" ]; then
            npx wrangler secret bulk "$RUNNER_TEMP/shop-secrets.json" --config shop/wrangler.toml
          fi
          rm -f "$RUNNER_TEMP/shop-secrets.json"
      - name: Skip deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set; see CLOUDFLARE-SETUP.md"
